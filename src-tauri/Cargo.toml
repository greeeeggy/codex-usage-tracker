[package]
name = "codex-meter"
version = "0.2.1"
description = "Codex Usage Monitor — track your Codex rate limits in real-time"
authors = ["you"]
edition = "2021"

[lib]
name = "codex_meter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.1", features = ["tray-icon"] }
tauri-plugin-opener = "~2.7.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
sysinfo = "0.34"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
tauri-plugin-notification = "~2.5.1"
tauri-plugin-store = "~2.5.0"
uuid = { version = "1.8", features = ["v4"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "~2.7.0"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "~2.5.0"
